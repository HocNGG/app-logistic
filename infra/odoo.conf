[options]
; ===========================================================================
; Odoo 17 dev config — dự án AppLogictics
; DB chuẩn của đề bài: odoo17_lab
;
; File này được mount vào container tại /etc/odoo/odoo.conf (xem
; infra/docker-compose.yml) -> MỌI đường dẫn bên dưới là đường dẫn TRONG
; container, không phải trên Windows.
;
; Chạy odoo-bin TRỰC TIẾP trên máy host thì db_host=db sẽ không resolve được:
; thêm --db_host=127.0.0.1 vào lệnh (xem ghi chú cuối file).
; ===========================================================================

; --- Database ---
; Khi chạy trong docker compose, "db" là tên service của Postgres.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo17_lab
; Chỉ cho phép đúng DB của dự án -> tránh vào nhầm DB khi demo/e2e.
dbfilter = ^odoo17_lab$

; --- Addons ---
; /mnt/extra-addons : volume mount addons/ của repo (lab_core, lab_chuyen,
;                     lab_laixe, lab_hanhtrinh, lab_api + thư mục oca/).
;                     Odoo tự quét thêm MỘT cấp con -> addons/oca/<module>
;                     cũng được nhận (vendor-oca.ps1 copy module ra đúng cấp đó).
; /usr/lib/python3/dist-packages/odoo/addons : addons gốc của image odoo:17.0
; Odoo chi quet MOI addons_path them MOT cap con -> addons/oca PHAI la mot entry rieng.
; Thieu dong nay: base_tier_validation + helpdesk_mgmt VO HINH, lab_chuyen KHONG cai duoc.
addons_path = /mnt/extra-addons,/mnt/extra-addons/oca,/usr/lib/python3/dist-packages/odoo/addons

; --- Runtime (dev) ---
; workers = 0 : chế độ đơn tiến trình, có traceback đầy đủ trong log — dùng khi
; phát triển. Demo cũng dùng 0 để log dễ đọc trên một máy.
workers = 0
max_cron_threads = 1
log_level = info
; dev = all  ; bật khi cần reload asset/qweb tự động, TẮT khi demo
; proxy_mode = True  ; chỉ bật khi đứng sau reverse proxy (nginx), không bật ở local

; --- Bảo mật ---
; CHỈ dùng ở máy local. Production: đổi admin_passwd, tắt list_db.
admin_passwd = admin
list_db = True

; --- Ghi chú cho người vận hành ---
; 1. Vendor OCA (base_tier_validation ở OCA/server-ux, helpdesk_mgmt ở OCA/helpdesk):
;    powershell -File infra/scripts/vendor-oca.ps1
;
; 2. Cài module (thứ tự phụ thuộc: lab_core -> lab_chuyen -> lab_laixe -> lab_hanhtrinh -> lab_api):
;    docker compose -f infra/docker-compose.yml exec odoo \
;      odoo -c /etc/odoo/odoo.conf -d odoo17_lab \
;      -u lab_core,lab_chuyen,lab_laixe,lab_hanhtrinh,lab_api --stop-after-init
;
; 3. Chạy test:
;    odoo -c /etc/odoo/odoo.conf -d odoo17_lab \
;      --test-tags=/lab_core,/lab_chuyen,/lab_laixe,/lab_hanhtrinh --stop-after-init
;
; 4. Reset dữ liệu demo:  powershell -File infra/scripts/reset-demo.ps1
;
; 5. Kiểm tra tĩnh (KHÔNG cần docker, KHÔNG cần Odoo):
;    powershell -File infra/scripts/check.ps1
;
; 6. Chạy odoo-bin trên HOST (không qua docker) — phải override db_host:
;    python odoo-bin -c infra/odoo.conf -d odoo17_lab --db_host=localhost --db_port=5432 ^
;      --addons-path=addons,infra/odoo/addons
