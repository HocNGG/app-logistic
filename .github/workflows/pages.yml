# =====================================================================================
# Deploy landing page lên GitHub Pages.
#
# VÌ SAO CHỈ CÓ LANDING: đây là phần duy nhất của dự án chạy được như site tĩnh
# (demo/landing/index.html + assets/). Odoo và app KMP cần server/thiết bị, không deploy
# tĩnh được — 2 phần đó dùng job riêng khi cần (xem workflow/android-apk.yml, tắt mặc định).
#
# LUẬT CỦA WORKFLOW NÀY:
#  1. KHÔNG cần secret: dùng GITHUB_TOKEN do GitHub cấp (khai ở `permissions`).
#  2. Kiểm tra sớm cho FAIL NHANH: index.html tồn tại, video hero còn đó (không ai xoá nhầm
#     "background vid đầu tiên" mà khách yêu cầu giữ), không file nào vượt giới hạn Pages.
#  3. `path: demo/landing` ⇒ index.html nằm ở GỐC site. Nếu đổi thành `path: .` thì URL sẽ
#     thành https://<user>.github.io/<repo>/demo/landing/ — dễ quên, nên chốt ở đây.
# =====================================================================================

name: Deploy landing → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Chỉ chạy khi landing đổi ⇒ không tốn phút CI cho commit backend
      - "demo/landing/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "demo/landing/**"
  workflow_dispatch: # bấm chạy tay từ tab Actions

# Quyền tối thiểu để deploy Pages: đọc code + ghi Pages + lấy OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# Hai lần push liên tiếp: huỷ lần cũ, chỉ deploy bản mới nhất
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------------
  # JOB 1: kiểm tra + đóng gói site (chạy cả trên PR để bắt lỗi sớm, KHÔNG deploy)
  # -----------------------------------------------------------------------------------
  build:
    name: Kiểm tra & đóng gói landing
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra cấu trúc bắt buộc
        run: |
          set -e
          echo "::group::Cấu trúc demo/landing"
          ls -la demo/landing
          echo "::endgroup::"
          test -f demo/landing/index.html || { echo "::error::Thiếu demo/landing/index.html"; exit 1; }
          # Hero video là yêu cầu cứng của khách ("vẫn phải giữ background vid đầu tiên")
          test -f demo/landing/assets/video/hero.mp4 || { echo "::error::Thiếu assets/video/hero.mp4 — khách yêu cầu GIỮ video nền hero"; exit 1; }
          # 3 ảnh app light (thay cho ảnh navy cũ) phải còn
          for f in app-welcome.png app-login.png app-driver-jobs.png; do
            test -f "demo/landing/assets/img/$f" || { echo "::error::Thiếu ảnh assets/img/$f"; exit 1; }
          done
          echo "OK: index.html + hero.mp4 + 3 ảnh app đều có."

      - name: "Chặn file quá lớn (Pages giới hạn 1 GB/site, git giới hạn 100 MB/file)"
        run: |
          set -e
          BIG=$(find demo/landing -type f -size +95M -print)
          if [ -n "$BIG" ]; then
            echo "::error::Có file > 95 MB, GitHub sẽ từ chối: $BIG"
            exit 1
          fi
          echo "Kích thước site: $(du -sh demo/landing | cut -f1)"

      - name: Kiểm tra CTA trỏ Odoo (không để landing mất nút vào hệ thống)
        run: |
          set -e
          COUNT=$(grep -o 'http://[^"]*8069' demo/landing/index.html | wc -l | tr -d ' ')
          echo "Số link CTA tới Odoo (port 8069): $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Landing không còn link nào tới Odoo (port 8069)"
            exit 1
          fi

      - name: Cấu hình Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Đóng gói artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/landing

  # -----------------------------------------------------------------------------------
  # JOB 2: deploy (chỉ khi push main hoặc chạy tay — KHÔNG chạy trên PR)
  # -----------------------------------------------------------------------------------
  deploy:
    name: Phát hành lên Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ghi URL ra bảng tổng kết
        run: |
          echo "### Landing đã phát hành" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nhớ: nút **Vào Odoo (web)** trỏ tới \`localhost:8069\` — chỉ mở được khi Odoo đang chạy trên chính máy đang xem." >> $GITHUB_STEP_SUMMARY
