# Gradle / JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official

# Bật để thấy cảnh báo sớm về API sắp bị bỏ (tắt khi demo cho sạch log)
# kotlin.mpp.stability.nowarn=false

# =======================================================================================
# ANDROID TARGET (Wave C) — ba cờ dưới đây BẮT BUỘC, thiếu là build Android đỏ ngay:
#
# · android.useAndroidX=true
#   androidMain kéo `androidx.activity:activity-compose` (và Compose Multiplatform kéo
#   `androidx.compose.*`). Nếu cờ này không bật, AGP dừng build với:
#   "Configuration ':composeApp:debugRuntimeClasspath' contains AndroidX dependencies, but the
#    'android.useAndroidX' property is not enabled".
#
# · android.nonTransitiveRClass=true
#   Mỗi module chỉ sinh R cho tài nguyên CỦA NÓ (mặc định của AGP 8+). Khai tường minh để bản
#   build không phụ thuộc default của AGP.
#
# · android.builtInKotlin=false
#   AGP 9 có tính năng "built-in Kotlin" (tự biên dịch Kotlin, xem `android.builtInKotlin` trong
#   BooleanOption của AGP 9.4.1). Dự án này đã có Kotlin Gradle Plugin (2.4.21) lo phần Kotlin
#   cho CẢ desktop và Android — bật thêm built-in Kotlin là hai bộ biên dịch cùng đăng ký một
#   compilation. Đặt `false` = "KGP lo Kotlin", tức hành vi KMP cổ điển đã được kiểm chứng.
#   (Nếu một bản AGP sau bỏ hẳn tuỳ chọn này, Gradle chỉ cảnh báo "unused property", không đỏ.)
# =======================================================================================
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false

# · android.newDsl=false  (BẮT BUỘC — đã đo bằng build thật, không phải phỏng đoán)
#   AGP 9 bật DSL mới (`android.newDsl=true`) làm mặc định. KMP hiện chưa theo kịp:
#   build đỏ với  "The 'org.jetbrains.kotlin.multiplatform' plugin with `androidTarget()`
#   enabled is not compatible with AGP's 9.0 new DSL"  +  ClassCastException
#   ApplicationExtensionImpl -> BaseExtension.
#   AGP gợi ý hai đường: (a) tách app Android ra subproject riêng, hoặc (b) tạm đặt
#   `android.newDsl=false`. Chọn (b) vì app này là MỘT module KMP (desktop + android dùng chung
#   100% code UI); tách subproject sẽ nhân đôi cấu hình để đổi lấy 0 tính năng.
#   Ghi chú: cờ này sẽ bị bỏ ở AGP 10 -> khi nâng cấp, chuyển sang
#   `com.android.kotlin.multiplatform.library` + app shell riêng (xem https://kotl.in/gradle/agp-new-kmp).
android.newDsl=false
